project:
  type: website
  output-dir: _site
  render:
    - "*.md"
    - "!README.md"
  resources:
    - forcing-builder/

website:
  title: "YelmoX"
  description: "Documentation for the YelmoX ice-sheet modelling framework"
  repo-url: https://github.com/fesmc/yelmox
  repo-actions: [edit, issue]
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.md
      - text: "yelmox"
        menu:
          - text: "yelmox"
            href: yelmox.md
          - text: "yelmox_bipolar"
            href: yelmox-bipolar.md
          - text: "Long runs in chunks"
            href: run-chunks.md
          - text: "Forcing builder"
            href: forcing-builder.md
      - text: "Climate backends"
        menu:
          - text: "Snapshots"
            href: climate-snapshots.md
          - text: "ESM forcing"
            href: climate-esm.md
          - text: "REMBO climate"
            href: climate-rembo.md
      - text: "Experiments"
        menu:
          - text: "Greenland"
            href: experiment-greenland.md
          - text: "Antarctica"
            href: experiment-antarctica.md
          - text: "ISMIP7 projections"
            href: experiment-ismip7.md
          - text: "1pctCO2"
            href: experiment-1pctco2.md
          - text: "TIPMIP"
            href: experiment-tipmip.md
          - text: "Antarctic paleo"
            href: experiment-ant-paleo.md
          - text: "Greenland paleo"
            href: experiment-grl-paleo.md
          - text: "Laurentide and North America"
            href: experiment-laurentide.md
          - text: "Mountain glaciers"
            href: experiment-mountain.md
      - text: "Database namelists"
        href: database-namelists.md
      - text: "Multigrid coupling"
        href: multigrid.md

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    html-math-method: katex
    link-external-newwindow: true
